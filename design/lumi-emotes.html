<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumi Emote Set</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --cocoa: #5a4636;
    --lilac: #e8d6f7;
    --bg: #fff8f1;
    --ink: #2e2440;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--cocoa);
    font-family: "Patrick Hand", "Comic Sans MS", cursive; font-size: 20px;
    padding: 24px 16px 60px;
  }
  main { max-width: 1160px; margin: 0 auto; }
  h1 { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: clamp(28px, 6vw, 48px); text-align: center; margin: 0; }
  .sub { text-align: center; margin: 4px auto 20px; max-width: 760px; }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; margin-bottom: 26px; }
  .tools button {
    font: inherit; font-size: 18px; color: var(--ink); background: #fffdf8; cursor: pointer;
    border: 3px solid var(--ink); border-radius: 999px; padding: 4px 16px; box-shadow: 3px 3px 0 var(--lilac);
  }
  .tools button[aria-pressed="true"] { background: #d6cdf3; }
  .tools label { display: none; align-items: center; gap: 8px; font-size: 18px; }
  body[data-view="overlay"] .tools label { display: inline-flex; }

  .win {
    background: #fffdf8; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden;
    box-shadow: 5px 5px 0 var(--lilac);
  }
  .win .bar {
    background: #d6cdf3; border-bottom: 3px solid var(--ink); padding: 6px 12px;
    font-family: monospace; font-size: 16px; display: flex; justify-content: space-between;
  }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 500px), 1fr)); gap: 22px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 14px 4px; background: #fffdfa; }
  figure { margin: 0; text-align: center; }
  figcaption { font-size: 16px; opacity: .75; margin-top: 2px; }
  .stack { position: relative; aspect-ratio: 1; }
  .stack > * { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stack svg { overflow: visible; }
  .ref img { width: 100%; aspect-ratio: 1; display: block; }
  .ghost { opacity: .5; pointer-events: none; display: none !important; }
  .note { margin: 6px 16px 14px; font-size: 17px; line-height: 1.3; }
  .card { background: #fffdfa; }

  /* overlay: the reference sits on top of the SVG at the chosen opacity */
  body[data-view="overlay"] .ref { display: none; }
  body[data-view="overlay"] .pair { grid-template-columns: minmax(0, 420px); justify-content: center; }
  body[data-view="overlay"] .ghost { display: block !important; }
  /* emotes: just the SVG emotes in a row, like the original sheet */
  body[data-view="sheet"] .cards { grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 12px; }
  body[data-view="sheet"] .card { border: 0; box-shadow: none; background: transparent; }
  body[data-view="sheet"] .bar, body[data-view="sheet"] .ref, body[data-view="sheet"] .note, body[data-view="sheet"] figcaption { display: none; }
  body[data-view="sheet"] .pair { grid-template-columns: 1fr; padding: 0; background: transparent; }

  /* motion: the same beats as the sticker set */
  .bob { animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .wl { transform-origin: 96px 178px; animation: flapL 2.6s ease-in-out -2.4s infinite; }
  .wr { transform-origin: 166px 178px; animation: flapR 2.6s ease-in-out -2.4s infinite; }
  @keyframes flapL { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  @keyframes flapR { 0%, 100% { transform: rotate(3deg); } 50% { transform: rotate(-3deg); } }
  .ray, .glint { animation: twinkle 1.6s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: .25; } }
  .blink { transform-origin: center; transform-box: fill-box; animation: blink 4.5s infinite; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  .bounce { animation: bounce .9s ease-in-out infinite; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .beat { transform-box: fill-box; transform-origin: center; animation: beat 1.4s ease-in-out infinite; }
  .beat:nth-of-type(2) { animation-delay: -.45s; }
  .beat:nth-of-type(3) { animation-delay: -.9s; }
  @keyframes beat { 0%, 30%, 100% { transform: scale(1); } 15% { transform: scale(1.12); } 45% { transform: scale(1.05); } }
  /* sleepy breathes slowly and its z's drift; sad sinks a little and its tears swell */
  .breathe { transform-origin: 130px 236px; animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.012, 1.025); } }
  .zz path { animation: zz 3s ease-in-out infinite; }
  .zz path:nth-child(2) { animation-delay: -1.5s; }
  @keyframes zz { 0%, 100% { opacity: .95; translate: 0 0; } 50% { opacity: .55; translate: 0 -3px; } }
  .droop { animation: droop 3.6s ease-in-out infinite; }
  @keyframes droop { 50% { transform: translateY(2px); } }
  .well { transform-box: fill-box; transform-origin: 50% 0; animation: well 2.8s ease-in-out infinite; }
  @keyframes well { 50% { transform: scale(1.06, 1.14); } }
  @media (prefers-reduced-motion: reduce) {
    .bob, .wl, .wr, .ray, .glint, .blink, .bounce, .beat, .breathe, .zz path, .droop, .well { animation: none; }
  }
</style>
</head>
<body data-view="side">
<main>
  <h1>Lumi emote set ✨</h1>
  <p class="sub">The four emotes from the pastel moth emote sheet, redrawn as SVG with the Lumi parts. Each card puts the reference emote next to its SVG.</p>
  <div class="tools" role="group" aria-label="View">
    <button data-view="side" aria-pressed="true">Side by side</button>
    <button data-view="overlay" aria-pressed="false">Overlay</button>
    <button data-view="sheet" aria-pressed="false">SVG emotes only</button>
    <label>reference <input type="range" id="ghost" min="0" max="100" value="50"></label>
  </div>
  <div class="cards" id="cards"></div>
</main>

<script>
// Palette sampled from the emote sheet (the Lumi v4 colours where they match)
const C = {
  fur: "#fef9f3", lid: "#121010", eye: "#080506", eyeTint: "#5a3540", eyeTintDark: "#3c1f28",
  stalk: "#66432b", ring: "#fdf8f2", spot: "#e07373", blush: "#feb1be",
  wingLine: "#eabda0", lilacLine: "#bf9eee", vein: "#d4bef7", ray: "#fdd86a", gold: "#fddd77", star: "#fde07a",
  mouth: "#5e2a19", tongue: "#fd9898", zz: "#c6a3f8", mark: "#abbff7", brow: "#a8775a",
};

const f1 = (n) => n.toFixed(1);

const star4 = (x, y, s, fill, extra = "") =>
  `<path d="M${x} ${y - s} Q${x + s * .2} ${y - s * .2} ${x + s} ${y} Q${x + s * .2} ${y + s * .2} ${x} ${y + s} Q${x - s * .2} ${y + s * .2} ${x - s} ${y} Q${x - s * .2} ${y - s * .2} ${x} ${y - s} Z" fill="${fill}" ${extra}/>`;

const star5 = (x, y, R, r, fill) => {
  let d = "";
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + (i * Math.PI) / 5;
    const rad = i % 2 ? r : R;
    d += (i ? "L" : "M") + f1(x + Math.cos(a) * rad) + " " + f1(y + Math.sin(a) * rad);
  }
  return `<path d="${d}Z" fill="${fill}" stroke="${fill}" stroke-width="1.6" stroke-linejoin="round"/>`;
};

// Hearts are a little taller than wide and can be tilted around their own centre
const heart = (x, y, s, attrs, rot = 0) =>
  `<path transform="translate(${x} ${y}) rotate(${rot}) scale(${s} ${f1(s * 1.22)})" d="M0 -2 C-3 -7 -10 -4 -6 2 L0 7 L6 2 C10 -4 3 -7 0 -2 Z" ${attrs}/>`;

const seeded = (seed) => {
  let s = seed * 7 + 3;
  return () => (s = (s * 9301 + 49297) % 233280) / 233280;
};

// Organic oval: smooth closed curve through slightly jittered points (never a perfect circle)
function blob(cx, cy, rx, ry, seed, wob = .06, rotDeg = 0, n = 8) {
  const rand = seeded(seed);
  const rot = rotDeg * Math.PI / 180, cr = Math.cos(rot), sr = Math.sin(rot);
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const k = 1 + (rand() - .5) * 2 * wob;
    const x = Math.cos(a) * rx * k, y = Math.sin(a) * ry * k;
    pts.push([cx + x * cr - y * sr, cy + x * sr + y * cr]);
  }
  return smooth(pts);
}
// Smooth closed curve through the points (Catmull-Rom as cubic Béziers)
function smooth(pts) {
  const n = pts.length;
  let d = `M${f1(pts[0][0])} ${f1(pts[0][1])}`;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    d += ` C${f1(p1[0] + (p2[0] - p0[0]) / 6)} ${f1(p1[1] + (p2[1] - p0[1]) / 6)} ${f1(p2[0] - (p3[0] - p1[0]) / 6)} ${f1(p2[1] - (p3[1] - p1[1]) / 6)} ${f1(p2[0])} ${f1(p2[1])}`;
  }
  return d + "Z";
}

// Quadratic curve drawn as a filled shape that tapers from w0 to w1
function taper(p0, p1, p2, w0, w1, steps = 18) {
  const L = [], R = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps, mt = 1 - t;
    const x = mt * mt * p0[0] + 2 * mt * t * p1[0] + t * t * p2[0];
    const y = mt * mt * p0[1] + 2 * mt * t * p1[1] + t * t * p2[1];
    const dx = 2 * mt * (p1[0] - p0[0]) + 2 * t * (p2[0] - p1[0]);
    const dy = 2 * mt * (p1[1] - p0[1]) + 2 * t * (p2[1] - p1[1]);
    const len = Math.hypot(dx, dy) || 1;
    const w = (w0 + (w1 - w0) * t) / 2;
    L.push([x - (dy / len) * w, y + (dx / len) * w]);
    R.push([x + (dy / len) * w, y - (dx / len) * w]);
  }
  return "M" + L.concat(R.reverse()).map(p => f1(p[0]) + " " + f1(p[1])).join(" L") + " Z";
}
const qpt = (p0, p1, p2, t) => {
  const mt = 1 - t;
  return [mt * mt * p0[0] + 2 * mt * t * p1[0] + t * t * p2[0], mt * mt * p0[1] + 2 * mt * t * p1[1] + t * t * p2[1]];
};

// Traditional cloud: evenly spaced, same-sized scallops that all bulge outward (no dents).
// `pear` > 0 narrows the top and fills out the bottom; `flat` < 1 flattens the bottom (for sitting);
// `trim` = [angleDeg, amount, spreadDeg] pulls the outline in around one spot.
function scallop(cx, cy, rx, ry, n, seed, kR = .58, pear = 0, flat = 1, trim = null) {
  const rand = seeded(seed);
  // sample the outline by arc length so every scallop comes out the same size
  const M = 360, pts = [], len = [0];
  for (let i = 0; i <= M; i++) {
    const t = (i / M) * Math.PI * 2, s = Math.sin(t);
    const k = trim ? 1 - trim[1] * Math.exp(-(((t * 180 / Math.PI - trim[0]) / trim[2]) ** 2)) : 1;
    pts.push([cx + Math.cos(t) * rx * (1 + pear * s) * k, cy + ry * (s > 0 ? s ** flat : s) * k]);
    if (i) len.push(len[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  }
  const total = len[M], off = rand();
  const at = (s) => {
    s = ((s % total) + total) % total;
    let i = 1;
    while (len[i] < s) i++;
    const u = (s - len[i - 1]) / (len[i] - len[i - 1]);
    return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * u, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * u];
  };
  const notches = Array.from({ length: n }, (_, i) => at(((i + off + (rand() - .5) * .12) / n) * total));
  let d = `M${f1(notches[0][0])} ${f1(notches[0][1])}`;
  for (let i = 1; i <= n; i++) {
    const p = notches[i - 1], q = notches[i % n];
    const L = Math.hypot(q[0] - p[0], q[1] - p[1]), R = L * (kR + (rand() - .5) * .06);
    d += ` A${f1(R)} ${f1(R)} 0 0 1 ${f1(q[0])} ${f1(q[1])}`;
  }
  return (attrs) => `<path d="${d}Z" stroke-linejoin="round" ${attrs}/>`;
}

// Fluff = outline on the outside of the union only + gradient fill + clipped shading
function fluff(shape, clipId, fill, shading = "", stroke = 4.4, line = "#f0c9a8") {
  return `${shape(`fill="${line}" stroke="${line}" stroke-width="${stroke}"`)}
    <clipPath id="${clipId}">${shape("")}</clipPath>
    ${shape(`fill="${fill}"`)}
    <g clip-path="url(#${clipId})">${shading}</g>`;
}

// Superellipse (n = 4): the soft square each emote sits on
const squircle = ([x0, y0, x1, y1], n = 4, steps = 160) => {
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, a = (x1 - x0) / 2, b = (y1 - y0) / 2;
  let d = "";
  for (let i = 0; i < steps; i++) {
    const t = (i / steps) * Math.PI * 2, c = Math.cos(t), s = Math.sin(t);
    d += (i ? "L" : "M") + f1(cx + a * Math.sign(c) * Math.abs(c) ** (2 / n)) + " " + f1(cy + b * Math.sign(s) * Math.abs(s) ** (2 / n));
  }
  return d + "Z";
};

// Both eyes share one structure; only position (and the sparkle side) differ
const TILT = -5;
const EYE_RX = 15.5, EYE_RY = 16.5;

// Same order as the emote sheet; the sheet has no labels, so these name what each face shows
const MOODS = ["excited", "love", "sleepy", "sad"];
const LABELS = { excited: "excited", love: "love", sleepy: "sleepy", sad: "sad" };
// Each tile: its box (x0, y0, x1, y1) and the tint at its top and bottom edges
const TILES = {
  excited: { box: [11.2, 18.5, 248.8, 241], top: "#fdf5df", bot: "#feeec3" },
  love: { box: [9.2, 19, 250.8, 239.5], top: "#fde6e9", bot: "#fde3e6" },
  sleepy: { box: [8.5, 17.5, 251.5, 239], top: "#f1e5fc", bot: "#e9d6f9" },
  sad: { box: [11, 18, 249, 240.5], top: "#e7f0fd", bot: "#e2edfb" },
};

let uid = 0;
function emote(mood) {
  const id = "e" + uid++;
  const blur = (n) => `filter="url(#${id}b${n})"`;
  const LINE = `url(#${id}line)`;
  const tile = TILES[mood];
  // Blush: soft blurred pink with a crisp gradient border (lighter on top, deeper pink below)
  const blush = (x, y, rx = 11, ry = 8.5, seed = 21, rot = 0) => {
    const d = blob(x, y, rx, ry, seed, .07, rot);
    return `<path d="${d}" fill="${C.blush}" opacity=".9" ${blur(1)}/>
      <path d="${d}" fill="none" stroke="url(#${id}blushLine)" stroke-width="1.5" opacity=".7"/>`;
  };

  // ---------- Wings: a big peach wing with its eyespot on each side, a lilac one tucked below ----------
  // w = { peach: [cx, cy, rx, ry, rot], spot: [x, y, r], dot: [x, y], lilac: [cx, cy, rx, ry, rot], ldot: [x, y, r] }
  // The lilac wing has a vein that runs through its white dot, rising toward the body
  const VEIN = 30 * Math.PI / 180;
  const wing = (w, side) => {
    const pd = blob(...w.peach.slice(0, 4), side === "L" ? 31 : 33, .02, w.peach[4], 10);
    const ld = blob(...w.lilac.slice(0, 4), side === "L" ? 9 : 13, .03, w.lilac[4], 10);
    const [sx, sy, sr] = w.spot, k = side === "L" ? -1 : 1, [vx, vy] = w.ldot;
    const vc = Math.cos(VEIN) * 40, vs = Math.sin(VEIN) * 40;
    return `<path d="${pd}" fill="url(#${id}peach${side})"/><path d="${pd}" fill="url(#${id}wingBlush)"/>
      <path d="${pd}" fill="none" stroke="${C.wingLine}" stroke-width="3.4"/>
      <path d="${blob(sx, sy, sr, sr * .97, 2, .04)}" fill="${C.ring}"/>
      <path d="${blob(sx + .3, sy, sr * .63, sr * .61, 5, .05)}" fill="${C.spot}"/>
      <circle cx="${w.dot[0]}" cy="${w.dot[1]}" r="2.3" fill="#fff" opacity=".85"/>
      <path d="${ld}" fill="url(#${id}lilac${side})"/>
      <clipPath id="${id}lc${side}"><path d="${ld}"/></clipPath>
      <path d="M${f1(vx - k * vc)} ${f1(vy - vs)} L${f1(vx + k * vc)} ${f1(vy + vs)}" stroke="${C.vein}" stroke-width="3" clip-path="url(#${id}lc${side})"/>
      <path d="${ld}" fill="none" stroke="${C.lilacLine}" stroke-width="2.6"/>
      <path d="${blob(w.ldot[0], w.ldot[1], w.ldot[2], w.ldot[2] * .94, 9, .07)}" fill="#fff"/>`;
  };

  // ---------- Antennae: stalks run into the centre of each orb so they always connect ----------
  // twig: [where on the stalk, tip offset, bend offset]
  const drawAnt = (a, w0 = 8, w1 = 6.8) => {
    let twig = "";
    if (a.twig) {
      const p = qpt(a.b, a.c, a.o, a.twig[0]);
      const end = [p[0] + a.twig[1][0], p[1] + a.twig[1][1]];
      twig = `<path d="${taper(p, [p[0] + a.twig[2][0], p[1] + a.twig[2][1]], end, 6, 4.3, 12)}" fill="${C.stalk}"/>
        <circle cx="${f1(end[0])}" cy="${f1(end[1])}" r="2.15" fill="${C.stalk}"/>`;
    }
    const [ox, oy] = a.o, [bx, by] = a.b;
    return `<circle cx="${ox}" cy="${oy}" r="${a.r + 7}" fill="#fff6d6" opacity=".7" ${blur(5)}/>
      <path d="${taper(a.b, a.c, a.o, w0, w1)}" fill="${C.stalk}"/>
      <circle cx="${f1(bx)}" cy="${f1(by)}" r="${f1(w0 / 2)}" fill="${C.stalk}"/>${twig}
      <circle cx="${ox}" cy="${oy}" r="${a.r}" fill="url(#${id}orb)" stroke="url(#${id}orbRim)" stroke-width="2.8"/>
      <ellipse cx="${f1(ox - a.r * .12)}" cy="${f1(oy - a.r * .36)}" rx="${f1(a.r * .36)}" ry="${f1(a.r * .28)}" fill="#fffef8" opacity=".9" ${blur(2)}/>`;
  };
  const strokes = (list, color, w = 2.6, cls = "") => `<g class="${cls}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${list.map(d => `<path d="${d}"/>`).join("")}</g>`;
  const dashes = (list) => list.map(([x1, y1, x2, y2]) => `M${x1} ${y1} L${x2} ${y2}`);

  // ---------- Fluff: head and body are one cloud in the emote art ----------
  const headShape = scallop(132.5, 160.5, 72, 67, 16, 3, .55, .03);
  const head = (tufts) => `${fluff(headShape, `${id}hc`, `url(#${id}furH)`, `
    <ellipse cx="132" cy="244" rx="88" ry="30" fill="#fbdcb9" opacity=".8" ${blur(7)}/>`, 6, LINE)}
    ${strokes(tufts, "#f3d0b2", 2.8)}`;

  // ---------- Eyes ----------
  // The eye is a hair lighter at the top; a darker band along its lower side holds the reflection
  const eyeBase = (e, s = 1, d = null) => {
    const rx = EYE_RX * s, ry = EYE_RY * s;
    return `<g transform="rotate(${e.rot || 0} ${e.x} ${e.y})">
      <path d="${d || blob(e.x, e.y, rx, ry, e.seed, .03, TILT, 10)}" fill="url(#${id}eyeG)"/>
      <path d="${blob(e.x + 1, e.y + ry * .53, rx * .62, ry * .3, e.seed + 3, .08, TILT)}" fill="${C.eyeTintDark}"/>
      <path d="${blob(e.x + 1, e.y + ry * .45, rx * .62, ry * .3, e.seed + 3, .08, TILT)}" fill="${C.eyeTint}"/></g>`;
  };
  // Round shiny eye: a white shine high on the inner side, a small gold star low on the outer side
  const roundEye = (e, s, shine, star) => `<g class="pupil"><g class="blink">${eyeBase(e, s)}
    <circle cx="${shine[0]}" cy="${shine[1]}" r="${shine[2]}" fill="#fff"/>
    ${star5(star[0], star[1], star[2], star[2] * .5, C.star)}</g></g>`;
  // Teary eye: round, but its inner top corner rises to a soft point and the outer top flattens,
  // like puppy eyes. A brown brow flick sits on that corner and a tear pools along the lower lid
  const tear = (x, y, rx = 7.5, ry = 6.2, rot = 0) => `<g transform="rotate(${rot} ${x} ${y})"><g class="well">
    <path d="${blob(x, y, rx, ry, 17, .06)}" fill="url(#${id}tear)" stroke="#9dbcf4" stroke-width="1.1" opacity=".92"/>
    <ellipse cx="${f1(x - rx * .38)}" cy="${f1(y - ry * .25)}" rx="${f1(rx * .26)}" ry="${f1(ry * .22)}" fill="#fff" opacity=".9"/></g></g>`;
  const tearyEye = (e, s, [R, up, flat], shine, star, brow, tr) => {
    const tc = (e.side < 0 ? -62 : -118) * Math.PI / 180, tf = (e.side < 0 ? -141 : -39) * Math.PI / 180;
    const near = (t, t0, w) => Math.exp(-((Math.atan2(Math.sin(t - t0), Math.cos(t - t0)) / w) ** 2));
    const outline = smooth(Array.from({ length: 24 }, (_, i) => {
      const t = (i / 24) * Math.PI * 2, r = R * (1 + up * near(t, tc, .38) - flat * near(t, tf, .7));
      return [e.x + Math.cos(t) * r, e.y + Math.sin(t) * r];
    }));
    return `<g class="blink">${eyeBase(e, s, outline)}
        <circle cx="${shine[0]}" cy="${shine[1]}" r="${shine[2]}" fill="#fff"/>
        ${star5(star[0], star[1], star[2], star[2] * .5, C.star)}</g>
      <path d="${taper(...brow, 2.8, 1.4)}" fill="${C.brow}"/>
      ${tear(...tr)}`;
  };
  // Happy closed eye: a thick round ∩ with round ends; y is the line through its ends, h its height
  const closedEye = (x, y, w, h, rot = 0, sw = 5.8) => {
    const k = f1(y - h * 4 / 3);
    return `<path d="M${x - w} ${y} C${f1(x - w * .8)} ${k} ${f1(x + w * .8)} ${k} ${x + w} ${y}" fill="none" stroke="${C.lid}" stroke-width="${sw}" stroke-linecap="round" transform="rotate(${rot} ${x} ${y})"/>`;
  };
  // Sleepy closed eye: a thick arc sagging through `mid`, a little thinner toward its round tips
  const sleepEye = (p0, mid, p2, wEnd = 4.6, wMid = 6) => {
    const c = [2 * mid[0] - (p0[0] + p2[0]) / 2, 2 * mid[1] - (p0[1] + p2[1]) / 2];
    const h0 = [(p0[0] + c[0]) / 2, (p0[1] + c[1]) / 2], h2 = [(c[0] + p2[0]) / 2, (c[1] + p2[1]) / 2];
    return `<g fill="${C.lid}"><path d="${taper(p0, h0, mid, wEnd, wMid)} ${taper(mid, h2, p2, wMid, wEnd)}"/>
      <circle cx="${p0[0]}" cy="${p0[1]}" r="${f1(wEnd / 2)}"/><circle cx="${p2[0]}" cy="${p2[1]}" r="${f1(wEnd / 2)}"/></g>`;
  };

  // ---------- Mouths ----------
  // Open ω mouth (excited, love): round little corners, a coral inside and a pink tongue
  const catMouth = (x, y, w, h) => {
    const dl = [x - w * .8, y + 1.2], dr = [x + w * .8, y + 1.2];
    const open = `M${f1(dl[0])} ${f1(dl[1])} Q${f1(x - w * .4)} ${f1(y + 5)} ${x} ${y} Q${f1(x + w * .4)} ${f1(y + 5)} ${f1(dr[0])} ${f1(dr[1])}
      C${f1(x + w * .78)} ${f1(y + h * .72)} ${f1(x + w * .36)} ${f1(y + h)} ${x} ${f1(y + h)} C${f1(x - w * .36)} ${f1(y + h)} ${f1(x - w * .78)} ${f1(y + h * .72)} ${f1(dl[0])} ${f1(dl[1])} Z`;
    return `<clipPath id="${id}mc"><path d="${open}"/></clipPath>
      <path d="${open}" fill="url(#${id}mouthIn)"/>
      <ellipse cx="${x}" cy="${f1(y + h * .86)}" rx="${f1(w * .5)}" ry="${f1(h * .36)}" fill="${C.tongue}" clip-path="url(#${id}mc)"/>
      <path d="${open}" fill="none" stroke="${C.mouth}" stroke-width="2.8" stroke-linejoin="round"/>
      <path d="M${f1(dl[0])} ${f1(dl[1])} Q${f1(x - w * .96)} ${f1(y + 1.6)} ${x - w} ${f1(y - .6)} M${f1(dr[0])} ${f1(dr[1])} Q${f1(x + w * .96)} ${f1(y + 1.6)} ${x + w} ${f1(y - .6)}" fill="none" stroke="${C.mouth}" stroke-width="3" stroke-linecap="round"/>`;
  };
  // Small pout: a ∧ with a softly rounded tip at (x, y) and legs that bow out a little (sleepy, sad)
  const pout = (x, y, w, h, sw = 3, rot = 0) =>
    `<path d="M${x - w} ${y + h} Q${f1(x - w * .5)} ${f1(y + h * .2)} ${x} ${y} Q${f1(x + w * .5)} ${f1(y + h * .2)} ${x + w} ${y + h}" fill="none" stroke="${C.mouth}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" transform="rotate(${rot} ${x} ${y})"/>`;

  // ---------- Rig: tile, wings, the cloud, antennae; each emote places its own pieces ----------
  // o = { cls, wl, wr: wings; ant: antennae; rays: [x1, y1, x2, y2] dashes; tufts; face; back }
  const rig = (o) => `
    <path d="${squircle(tile.box)}" fill="url(#${id}tile)"/>
    <path d="${squircle(tile.box)}" fill="url(#${id}tileGlow)"/>
    ${o.back || ""}
    <g class="${o.cls || "bob"}">
      ${strokes(dashes(o.rays), C.ray, 3.6, "ray")}
      <g class="wl">${wing(o.wl, "L")}</g><g class="wr">${wing(o.wr, "R")}</g>
      ${head(o.tufts)}
      ${o.ant.map(a => drawAnt(a)).join("")}
      ${o.face}
    </g>`;

  const poses = {
    // Big shiny eyes with a gold star in each, mouth open in a ω grin, sparkles on both sides
    excited: () => rig({
      cls: "bounce",
      wl: { peach: [44, 158, 33, 45, 38], spot: [34.3, 163.7, 13.9], dot: [45.2, 185.3], lilac: [63, 211, 22, 19.5, -15], ldot: [60, 208.7, 5] },
      wr: { peach: [216, 158, 33, 45, -38], spot: [225.7, 163.7, 13.6], dot: [215, 185.3], lilac: [201, 209, 22, 19.5, 15], ldot: [205, 208, 5] },
      ant: [
        { b: [110, 96], c: [104, 68], o: [85.5, 50], r: 23, twig: [.3, [-14, 2.5], [-6, -1]] },
        { b: [155.5, 95], c: [163, 66], o: [193, 49.5], r: 23, twig: [.3, [14, 2.5], [6, -1]] },
      ],
      rays: [[46, 24, 55, 30.5], [35, 46, 49, 47.5], [46, 72.5, 55, 65.5], [224, 34, 232.5, 27.5], [228, 52, 242.5, 51], [222.5, 67, 228.8, 73]],
      tufts: ["M98 134.5 Q103 130.5 108 133.5", "M157.5 133.5 Q162 130.5 166 133.5", "M111 213.5 q2 1.2 4 0", "M131 215.4 q2 1.2 4 0", "M142 213 q2 1.2 4 0"],
      face: `${blush(84.4, 183.6, 13.8, 11.2, 21)}${blush(181.3, 183.6, 13.8, 11.2, 23)}
        ${roundEye({ x: 98, y: 164.5, side: -1, seed: 11 }, 1.18, [102.5, 157, 5.4], [92, 172, 5])}
        ${roundEye({ x: 169, y: 164.5, side: 1, seed: 11 }, 1.18, [167.7, 157, 5.4], [174.4, 172, 5])}
        ${catMouth(134, 176.5, 11, 14.5)}`,
      back: `<g class="glint">${star4(37.5, 89, 12.6, C.gold, `stroke="${C.gold}" stroke-width="2.6" stroke-linejoin="round"`)}
        ${star4(64, 92, 8.6, "#fde58f", `stroke="#fde58f" stroke-width="2" stroke-linejoin="round" transform="translate(64 92) scale(.7 1) translate(-64 -92)"`)}</g>
        ${star4(215, 92.5, 11, C.gold, `stroke="${C.gold}" stroke-width="2.6" stroke-linejoin="round"`)}
        <circle cx="227.5" cy="107.5" r="2.2" fill="#fde9a8"/>`,
    }),

    // Eyes closed in happy ∩ arcs, ω mouth, pink hearts floating up beside the head
    love: () => rig({
      wl: { peach: [43, 159, 33, 45, 38], spot: [33.8, 162, 13.8], dot: [43, 184], lilac: [61, 209, 21.5, 19.5, -15], ldot: [57.5, 207, 5] },
      wr: { peach: [217, 167, 33, 45, -38], spot: [226, 174.5, 13.8], dot: [214.5, 195], lilac: [199, 210, 22, 20, 15], ldot: [202.5, 209.5, 5] },
      ant: [
        { b: [108, 88.8], c: [98, 68], o: [66.3, 50], r: 23, twig: [.45, [-12, 12], [-5, 4]] },
        { b: [156, 88], c: [164, 66], o: [194.5, 52.5], r: 23, twig: [.45, [12.2, 14.6], [6, 4]] },
      ],
      rays: [[31, 22.5, 40, 31], [17.5, 45, 31, 47.5], [26, 71, 36, 64.5], [222.5, 35, 232, 28], [229, 53, 243, 53], [222.5, 70, 231, 77.5]],
      tufts: ["M95.5 129.5 Q101 125 107.5 128", "M154 128 Q160 125 166 129.5"],
      face: `${blush(82, 181, 14, 11, 21)}${blush(180, 182, 14, 11, 23)}
        ${closedEye(96, 168.4, 13.2, 6.8, -2)}${closedEye(164.3, 168.8, 13.2, 7, 3)}
        ${catMouth(131, 173.6, 10.8, 14.6)}`,
      back: `<g fill="url(#${id}heartE)">
        <g class="beat">${heart(32.5, 89, 1.42, "", -10)}</g>
        <g class="beat">${heart(58, 95.5, 1, "", 8)}</g>
        <g class="beat">${heart(218.8, 98.3, 1.45, "", 12)}</g></g>`,
    }),

    // Dozing off: head tipped, eyes shut in soft crescents, a tiny pout, two z's drifting up
    sleepy: () => rig({
      cls: "breathe",
      wl: { peach: [41.8, 160, 33, 45, 38], spot: [28.8, 167.5, 11.5], dot: [41, 187.5], lilac: [60, 210, 22, 18.5, -15], ldot: [56, 209, 5] },
      wr: { peach: [217, 152.5, 33, 45, -38], spot: [225, 155.5, 13.6], dot: [215, 177], lilac: [203, 199, 22.5, 22, 15], ldot: [207, 201, 5] },
      ant: [
        { b: [88.8, 101], c: [74, 84], o: [42.5, 73.8], r: 23, twig: [.4, [-4, 9], [-3, 4]] },
        { b: [137, 93.8], c: [142, 66], o: [170, 47.5], r: 23, twig: [.45, [12, 6], [6, 1]] },
      ],
      rays: [[7.5, 50, 14, 57], [0, 71, 9, 73], [200, 32.5, 207, 27.5], [205, 43, 215, 41]],
      tufts: ["M86 139 Q92 134.5 99 136", "M146 130 Q151.5 125.5 157.5 127"],
      face: `${blush(87.5, 194.5, 12.5, 10, 21)}${blush(180.5, 178, 13, 10.5, 23)}
        ${sleepEye([82.6, 181.2], [96.3, 184.6], [110.6, 176.6])}${sleepEye([150.3, 168.4], [162, 171.8], [178.4, 163.2])}
        ${pout(134.3, 184, 5.2, 2.2, 2.6, -6)}`,
      back: strokes(["M199.5 86.5 L212.5 85 L200 101 L213.5 100", "M222.5 67.5 L238.5 66 L223 83.5 L239.5 82.5"], C.zz, 5, "zz"),
    }),

    // Puppy eyes welling up with tears, a small wobbly frown, blue gloom marks
    sad: () => rig({
      cls: "droop",
      wl: { peach: [43, 155, 33, 45, 38], spot: [35, 158, 13.5], dot: [43.8, 179.5], lilac: [58, 205, 22, 20, -15], ldot: [55, 206, 5] },
      wr: { peach: [217, 161, 33, 45, -38], spot: [226.3, 164.5, 13.8], dot: [215.5, 185.5], lilac: [201, 206, 22, 21, 15], ldot: [205.5, 208.8, 5] },
      ant: [
        { b: [105, 94.5], c: [92, 72], o: [61.3, 57.5], r: 23, twig: [.42, [-6, 11], [-4, 5]] },
        { b: [152, 95], c: [163, 66], o: [191, 51], r: 23, twig: [.28, [6, 11], [4, 5]] },
      ],
      rays: [[24, 39, 31, 44], [16, 54, 27.5, 55.5], [217.5, 26, 224, 21], [225, 36, 234.5, 32.5]],
      tufts: ["M99 133 Q104 129 109 131", "M152 131 Q157 128 162 131.5"],
      face: `${blush(83.3, 186.5, 13, 11, 21)}${blush(179, 183.6, 13, 11, 23)}
        ${tearyEye({ x: 96.6, y: 166.3, side: -1, seed: 11 }, 1.18, [18.2, .14, .1], [102.1, 160.2, 5.4], [90.5, 173.6, 5], [[104.2, 149], [105.4, 146.2], [107.6, 143.8]], [85, 182.5, 8.7, 5.8, -8])}
        ${tearyEye({ x: 164.3, y: 165.4, side: 1, seed: 11 }, 1.10, [17.4, .15, .1], [159.2, 158.2, 5.0], [169.4, 171.7, 4.7], [[156.4, 148.8], [155.0, 146.3], [153.9, 144.1]], [176.5, 179.8, 8.9, 6.1, 8])}
        ${pout(131.6, 180.8, 7.6, 5.8, 3.2)}`,
      back: `${strokes(dashes([[218.8, 75, 212, 87.5], [231.3, 82, 220, 93.8], [237, 98.8, 226.3, 102.5]]), C.mark, 5)}
        ${strokes(["M22 107.5 Q31 108 40 110.5"], "#c3d5fb", 4.6)}`,
    }),
  };

  return `<svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lumi emote, ${LABELS[mood]}">
    <defs>
      <filter id="${id}b1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation=".7"/></filter>
      <filter id="${id}b2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.8"/></filter>
      <filter id="${id}b5" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
      <filter id="${id}b6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
      <filter id="${id}b7" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
      <linearGradient id="${id}tile" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${tile.top}"/><stop offset="1" stop-color="${tile.bot}"/></linearGradient>
      <radialGradient id="${id}tileGlow" cx=".5" cy=".5" r=".55">
        <stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset=".55" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <linearGradient id="${id}blushLine" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fbc4ce"/><stop offset="1" stop-color="#ee8fa5"/></linearGradient>
      <linearGradient id="${id}eyeG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1a1214"/><stop offset=".55" stop-color="${C.eye}"/></linearGradient>
      <linearGradient id="${id}line" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f6dbc2"/><stop offset=".55" stop-color="#f0c6a4"/><stop offset="1" stop-color="#ebb98f"/></linearGradient>
      <radialGradient id="${id}furH" gradientUnits="userSpaceOnUse" cx="132" cy="150" r="92">
        <stop offset="0" stop-color="#fffcf8"/><stop offset=".75" stop-color="${C.fur}"/><stop offset="1" stop-color="#fcefe0"/></radialGradient>
      <linearGradient id="${id}orbRim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe196"/><stop offset=".45" stop-color="#fdd477"/><stop offset="1" stop-color="#f0a83c"/></linearGradient>
      <radialGradient id="${id}orb" cx=".42" cy=".32" r=".72">
        <stop offset="0" stop-color="#fff8dc"/><stop offset=".4" stop-color="#ffe9a6"/><stop offset=".8" stop-color="#fed06a"/><stop offset="1" stop-color="#f6b74c"/></radialGradient>
      <linearGradient id="${id}wingBlush" x1="0" y1="0" x2="0" y2="1">
        <stop offset=".5" stop-color="#f8b4a8" stop-opacity="0"/><stop offset="1" stop-color="#f8b4a8" stop-opacity=".45"/></linearGradient>
      <radialGradient id="${id}peachL" cx=".35" cy=".45" r=".8">
        <stop offset="0" stop-color="#fde6d6"/><stop offset=".55" stop-color="#fcdac8"/><stop offset=".85" stop-color="#f9ccb9"/><stop offset="1" stop-color="#f6bfae"/></radialGradient>
      <radialGradient id="${id}peachR" cx=".65" cy=".45" r=".8">
        <stop offset="0" stop-color="#fde6d6"/><stop offset=".55" stop-color="#fcdac8"/><stop offset=".85" stop-color="#f9ccb9"/><stop offset="1" stop-color="#f6bfae"/></radialGradient>
      <radialGradient id="${id}lilacL" cx=".45" cy=".4" r=".75">
        <stop offset="0" stop-color="#ece0fc"/><stop offset=".6" stop-color="#dcc6f9"/><stop offset="1" stop-color="#c6a6f2"/></radialGradient>
      <radialGradient id="${id}lilacR" cx=".55" cy=".4" r=".75">
        <stop offset="0" stop-color="#ece0fc"/><stop offset=".6" stop-color="#dcc6f9"/><stop offset="1" stop-color="#c6a6f2"/></radialGradient>
      <linearGradient id="${id}tear" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2ecfd"/><stop offset="1" stop-color="#a6c5f7"/></linearGradient>
      <linearGradient id="${id}mouthIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c55e4f"/><stop offset=".5" stop-color="#ef8778"/></linearGradient>
      <radialGradient id="${id}heartE" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#fdc4bc"/><stop offset="1" stop-color="#f9979f"/></radialGradient>
    </defs>
    ${poses[mood]()}
  </svg>`;
}

// What still differs from the emote art, per card
const NOTES = {
  excited: "Close match. Bounces, the gold rays and sparkles twinkle, and the eyes follow your cursor.",
  love: "Close match. The hearts beat one after another.",
  sleepy: "Close match. Breathes slowly; the z's drift.",
  sad: "Still different: the outer top of the left eye sits a touch lower than in the emote. Sinks a little and the tears swell.",
};

const ref = (m) => `emotes-ref/${m}.png`;
const cards = document.getElementById("cards");
cards.innerHTML = MOODS.map(m => `
  <article class="win card">
    <div class="bar"><span>lumi_${m}.svg</span><span>_ □ x</span></div>
    <div class="pair">
      <figure class="ref"><img src="${ref(m)}" alt="Reference emote: ${LABELS[m]}"><figcaption>reference</figcaption></figure>
      <figure class="svg"><div class="stack">${emote(m)}<img class="ghost" src="${ref(m)}" alt=""></div><figcaption>SVG</figcaption></figure>
    </div>
    ${NOTES[m] ? `<p class="note">${NOTES[m]}</p>` : ""}
  </article>`).join("");

// View switcher (also opens straight to #overlay or #sheet) + overlay strength
const setView = (v) => {
  document.body.dataset.view = v;
  document.querySelectorAll(".tools button").forEach(o => o.setAttribute("aria-pressed", o.dataset.view === v));
};
document.querySelectorAll(".tools button").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
if (["#overlay", "#sheet"].includes(location.hash)) setView(location.hash.slice(1));
const ghost = document.getElementById("ghost");
ghost.addEventListener("input", () => document.querySelectorAll(".ghost").forEach(g => g.style.opacity = ghost.value / 100));

// #compare[=love,sad]: reference | SVG | overlay at 2x, for checking proportions
if (location.hash.startsWith("#compare")) {
  const list = location.hash.split("=")[1]?.split(",") || MOODS;
  document.body.style.padding = "0";
  document.head.insertAdjacentHTML("beforeend", "<style>* { animation: none !important; }</style>");
  document.body.innerHTML = list.map(m => `<div style="display:flex">
    <img src="${ref(m)}" style="width:520px;height:520px">
    <div style="position:relative;width:520px;height:520px">${emote(m)}</div>
    <div style="position:relative;width:520px;height:520px">${emote(m)}<img src="${ref(m)}" style="position:absolute;inset:0;width:520px;height:520px;opacity:.5"></div></div>`).join("");
  document.querySelectorAll("body > div > div > svg").forEach(s => Object.assign(s.style, { position: "absolute", inset: 0, width: "520px", height: "520px" }));
}

// Eyes follow the pointer (mouse or touch)
addEventListener("pointermove", e => {
  document.querySelectorAll(".pupil").forEach(p => {
    const r = p.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2);
    const dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy) || 1;
    const m = Math.min(3, len / 40);
    p.setAttribute("transform", `translate(${(dx / len) * m} ${(dy / len) * m})`);
  });
});
</script>
</body>
</html>
